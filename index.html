<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Filipe Bueno | Consultoria em Marketing Digital</title>
  <meta name="description" content="Estratégia de marketing digital orientada a crescimento, performance e resultados de negócio.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #18343d;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .hero {
      max-width: 900px;
    }

    .tag {
      font-size: 14px;
      margin-bottom: 24px;
      color: #55717a;
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.05;
      margin-bottom: 28px;
      letter-spacing: -2px;
    }

    p {
      max-width: 650px;
      font-size: 20px;
      line-height: 1.6;
      color: #53676d;
      margin-bottom: 36px;
    }

    .button {
      display: inline-block;
      background: #18343d;
      color: white;
      text-decoration: none;
      padding: 17px 28px;
      border-radius: 8px;
      font-weight: 600;
    }

    .button:hover {
      opacity: .9;
    }
  </style>
</head>

<body>

  <main>
    <section class="hero">

      <div class="tag">
        Filipe Bueno • Consultoria em Marketing Digital
      </div>

      <h1>
        Marketing que sustenta crescimento.
      </h1>

      <p>
        Estratégia, SEO, mídia, experiência e dados conectados
        para transformar presença digital em resultado de negócio.
      </p>

      <a class="button" href="#">
        Vamos conversar
      </a>

    </section>
  </main>

</body>
</html>
